name: CI Quality & Security Gate

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Typecheck, Lint, Format, Test, Build & E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Unit & component tests (Vitest)
        run: npm test

      - name: Production build (offline shell verification)
        run: npm run build

      - name: Bundle & tracked-file secret scan
        run: npm run security:secrets

      - name: Install Playwright Chromium headless shell
        run: npx playwright install chromium --only-shell

      - name: Browser smoke & route-shell tests (Playwright)
        run: npm run test:e2e

  secret-scan-history:
    name: Git History Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full commit history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install and run Gitleaks v8.24.2
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --verbose --redact --config .gitleaks.toml .
