name: CI Quality & Security Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Typecheck, Lint, Format, Test, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Unit & component tests (Vitest)
        run: npm test

      - name: Production build (offline shell verification)
        run: npm run build

      - name: Bundle & tracked-file secret scan
        run: npm run security:secrets

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke & route-shell tests (Playwright)
        run: npm run test:e2e

  secret-scan-history:
    name: Git History Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
