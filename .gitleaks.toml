title = "Digital Wedding Invitation & RSVP Platform — Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow synthetic sb_publishable_ unit-test fixtures and documented .env.example placeholders"
regexTarget = "secret"
regexes = [
  '''^sb_publishable_(?:replace_me|your_key_here|test_[a-z0-9_]+|unit_test_[a-z0-9_]+|local_dev_[a-z0-9_]+)$''',
]
